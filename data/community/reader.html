<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在加载 - 共创书库 | 了了了读</title>
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../common-ui.css">
    <link rel="stylesheet" href="../../window.css">
    <link rel="stylesheet" href="../../reader.css">
    <link rel="stylesheet" href="../../reader-plus.css">
    <link rel="stylesheet" href="../../epub-bridge.css">
    <script src="../../common.js"></script>
    <script src="../../common-ui.js"></script>
    <script src="../../window.js"></script>
    <script defer src="../../reader.js"></script>
    <script defer src="../../reader-plus.js"></script>
    <script defer src="../../notes-plus.js"></script>
    <script defer src="../../epub-bridge.js"></script>
</head>
<body class="reader-page">

    <div class="reader-bg-layer" id="readerBgLayer"></div>
    <div class="reader-bg-overlay" id="readerBgOverlay"></div>
    <div class="reader-menu-toggle" id="readerMenuToggle">☰</div>

    <div class="reader-app">
        <div class="reader-sidebar">
            <div class="reader-sidebar-header">
                <div class="reader-sidebar-title">
                    <span class="zh-inline">共创书库 · 目录</span>
                    <span class="en-inline">Community · Contents</span>
                </div>
                <a href="./index.html" style="text-decoration:none;font-size:.8rem;color:var(--read-text-secondary);">
                    ← <span class="zh-inline">返回书库</span><span class="en-inline">Back</span>
                </a>
            </div>
            <div class="reader-search-box">
                <input type="text" id="readerSearchInput" class="reader-search-input" placeholder="搜索章节..." data-ph-zh="搜索章节..." data-ph-en="Search chapters...">
                <div class="reader-lang-note"><span class="zh-inline">界面语言与书籍正文语言相互独立；站内书正文为中文原文。</span><span class="en-inline">Interface language is separate from the book text: site books are in the Chinese original.</span></div>
            </div>
            <div class="reader-list" id="readerSidebarList"></div>
        </div>
        <div class="reader-main">
            <div class="reader-content-container" id="readerContent">
                <div class="reader-empty">
                    <span class="zh-inline">正在读取书籍配置…</span>
                    <span class="en-inline">Loading book configuration…</span>
                </div>
            </div>
        </div>
    </div>

    <div class="reader-notes-panel" id="readerNotesPanel">
        <div class="reader-notes-header">
            <span style="font-weight:700;"><span class="zh-inline">我的笔记</span><span class="en-inline">My Notes</span></span>
            <button style="border:none;background:transparent;font-size:1.2rem;cursor:pointer;" onclick="document.getElementById('readerNotesPanel').classList.remove('open')">×</button>
        </div>
        <div class="reader-notes-tabs">
            <div class="reader-notes-tab active" data-tab="bookmarks"><span class="zh-inline">书签</span><span class="en-inline">Bookmarks</span></div>
            <div class="reader-notes-tab" data-tab="highlights"><span class="zh-inline">高亮</span><span class="en-inline">Highlights</span></div>
            <div class="reader-notes-tab" data-tab="annotations"><span class="zh-inline">批注</span><span class="en-inline">Notes</span></div>
        </div>
        <div class="reader-notes-list" id="readerNotesList"></div>
    </div>

    <div class="reader-draggable" id="floatTheme" style="right:20px;bottom:80px;">
        <button onclick="toggleTheme()" title="明暗主题 / Dark mode" aria-label="明暗主题 / Dark mode">🌙</button>
        <button onclick="Reader.setColorTheme('sepia')" title="主题配色 / Theme color" aria-label="主题配色 / Theme color">🎨</button>
    </div>
    <div class="reader-draggable" id="floatFont" style="right:20px;bottom:140px;">
        <button onclick="Reader.setFontSize(parseInt(localStorage.getItem('lelele_read_fontSize')||17) - 1)" title="缩小字号 / Smaller text" aria-label="缩小字号 / Smaller text">A−</button>
        <button onclick="Reader.setFontSize(parseInt(localStorage.getItem('lelele_read_fontSize')||17) + 1)" title="放大字号 / Larger text" aria-label="放大字号 / Larger text">A+</button>
    </div>
    <div class="reader-draggable" id="floatTools" style="right:20px;bottom:200px;">
        <button onclick="document.getElementById('readerNotesPanel').classList.add('open')" title="我的笔记 / My notes" aria-label="我的笔记 / My notes">📝</button>
        <button onclick="Reader.toggleLayout()" title="调整布局 / Adjust layout" aria-label="调整布局 / Adjust layout">🖐️</button>
        <button onclick="Reader.importBook()" title="导入 EPUB / Import EPUB" aria-label="导入 EPUB / Import EPUB">📥</button>
        <button onclick="Reader.exportBook('epub')" title="导出 EPUB / Export EPUB" aria-label="导出 EPUB / Export EPUB">📚</button>
        <button onclick="Reader.exportBook('txt')" title="导出 TXT / Export TXT" aria-label="导出 TXT / Export TXT">📤</button>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', async function () {
        const content = document.getElementById('readerContent');
        const params = new URLSearchParams(window.location.search);
        const bookId = params.get('id');
        const lang = window.getLang();
        const fail = msg => {
            content.innerHTML = '<div class="reader-empty">' + window.escapeHtml(msg) + '</div>';
        };

        if (!bookId) return fail(lang === 'en' ? 'Missing ?id=xxx' : '错误：未指定书籍 ID（缺少 ?id=xxx）');

        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 8000);
        try {
            // 单页驱动：读同目录 books.json 拿外部 dataUrl
            const res = await fetch('./books.json', { signal: ctrl.signal });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const books = await res.json();
            const book = books.find(b => b.id === bookId);
            if (!book) return fail(lang === 'en' ? 'Book not found in this library' : '书库中未找到该书');
            if (!book.dataUrl) return fail(lang === 'en' ? 'This book has no dataUrl' : '该书尚未配置内容地址');

            const title = lang === 'en' ? (book.title_en || book.title_zh) : book.title_zh;
            document.title = title + ' · 共创书库';

            // 历史数据迁移：旧版 bookId 带 community_ 前缀，与主阅读器的笔记/进度键不互通
            try {
                const np = 'lelele_read_notes_', pp = 'lelele_read_progress_';
                if (localStorage.getItem(np + book.id) === null && localStorage.getItem(np + 'community_' + book.id) !== null)
                    localStorage.setItem(np + book.id, localStorage.getItem(np + 'community_' + book.id));
                if (localStorage.getItem(pp + book.id) === null && localStorage.getItem(pp + 'community_' + book.id) !== null)
                    localStorage.setItem(pp + book.id, localStorage.getItem(pp + 'community_' + book.id));
            } catch (e) { }

            Reader.init({
                bookId: book.id,
                bookTitle: book.title_zh,
                dataUrl: book.dataUrl,
                hasVerseNum: false,
                defaultFontSize: 18
            });
        } catch (err) {
            console.warn('[community-reader] 加载失败', err.message);
            fail(lang === 'en' ? 'Failed to load this book. Please try again later.' : '这本书暂时打不开，请稍后再试。');
        } finally {
            clearTimeout(timer);
        }
    });
    </script>
</body>
</html>
