<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共创书库 - 了了了读</title>
    
    <!-- 路径注意：需要返回根目录上一层 -->
    <link rel="stylesheet" href="../../common.css">
    <script src="../../common.js"></script>
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-page);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.2rem;
        }
        .brand img { width: 32px; height: 32px; border-radius: 50%; }
        .btn-back {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
        }

        .header-area {
            text-align: center;
            padding: 40px 20px 20px;
        }
        .header-area h1 {
            font-size: 2.2rem;
            color: var(--text-main);
            margin-bottom: 12px;
        }
        .header-area p {
            color: var(--text-muted);
        }

        /* 搜索框 */
        .search-container {
            max-width: 600px;
            margin: 0 auto 30px;
            padding: 0 20px;
        }
        .search-input {
            width: 100%;
            padding: 14px 24px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus { border-color: var(--primary); }

        /* 书库网格 */
        .library-container {
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .book-cover {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .book-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-author {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <!-- 注意返回路径也要加 ../../ -->
        <a href="../../index.html" class="brand">
            <img src="../../leleleread.svg" alt="Logo" onerror="this.style.display='none'">
            <span class="zh-inline">了了了读</span><span class="en-inline">lelele Read</span>
        </a>
        <a href="../../index.html" class="btn-back">← <span class="zh-inline">返回首页</span><span class="en-inline">Back</span></a>
    </nav>

    <div class="header-area">
        <h1><span class="zh-inline">共创书库</span><span class="en-inline">Community Library</span></h1>
        <p><span class="zh-inline">汇集每一位书友的灵感与创作</span><span class="en-inline">Gathering inspiration and creations from every reader</span></p>
        <a class="rd-btn primary" href="../login.html?redirect=../dashboard.html" style="margin-top:18px"><span class="zh-inline">想要成为作者？</span><span class="en-inline">Want to become an author?</span></a>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索书名或作者...">
    </div>

    <div class="library-container">
        <div class="book-grid" id="bookGrid">
            <!-- 数据由 JS 渲染 -->
        </div>
    </div>

    <div id="footerPlaceholder"></div>

    <script>
        let COMMUNITY_BOOKS = [];
        let loadFailed = false;
        let currentKeyword = '';

        function resolveAuthor(book, lang) {
            const a = book.author;
            if (a === 'luxun') return lang === 'en' ? 'Lu Xun' : '鲁迅';
            if (typeof a === 'number' || /^\d+$/.test(String(a))) {
                const found = (window.AUTHORS_DATA || []).find(x => String(x.id) === String(a));
                if (found) return lang === 'en' ? (found.name_en || found.name_zh) : (found.name_zh || found.name_en);
                if (book.author_label_zh || book.author_label_en) {
                    return lang === 'en' ? (book.author_label_en || book.author_label_zh) : (book.author_label_zh || book.author_label_en);
                }
                const list = window.AUTHORS_DATA || [];
                return list.length ? (lang === 'en' ? 'Unknown' : '未知作者') : '…';
            }
            return String(a || '');
        }

        function renderCommunityBooks() {
            const grid = document.getElementById('bookGrid');
            const lang = window.getLang();
            grid.innerHTML = '';

            if (loadFailed) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);">' +
                    (lang === 'en' ? 'Failed to load the library. Please refresh.' : '书库加载失败，请刷新重试') + '</div>';
                return;
            }
            if (!COMMUNITY_BOOKS.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);">' +
                    (lang === 'en' ? 'Loading books…' : '正在加载共创书库…') + '</div>';
                return;
            }

            const filtered = COMMUNITY_BOOKS.filter(book => {
                const hay = [book.title_zh, book.title_en, book.desc_zh, book.desc_en,
                    resolveAuthor(book, 'zh'), resolveAuthor(book, 'en')].join(' ').toLowerCase();
                return hay.indexOf(currentKeyword) !== -1;
            });

            if (!filtered.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);">' +
                    (lang === 'en' ? 'No matching books' : '没有找到匹配的书籍') + '</div>';
                return;
            }

            filtered.forEach(book => {
                const title = lang === 'en' ? (book.title_en || book.title_zh) : (book.title_zh || book.title_en);
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-cover">${window.escapeHtml(book.icon || '📖')}</div>
                    <div class="book-title">${window.escapeHtml(title)}</div>
                    <div class="book-author">${window.escapeHtml(resolveAuthor(book, lang))}</div>
                `;
                card.onclick = () => {
                    if (window.leleleTrack) window.leleleTrack('read_open-community_' + book.id);
                    window.location.href = 'reader.html?id=' + encodeURIComponent(book.id) + (lang === 'en' ? '&lang=en' : '');
                };
                grid.appendChild(card);
            });
        }

        async function loadCommunityBooks() {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 8000);
            try {
                const res = await fetch('./books.json', { signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                COMMUNITY_BOOKS = await res.json();
                loadFailed = false;
            } catch (e) {
                console.warn('[community] 书目加载失败', e.message);
                loadFailed = true;
            } finally {
                clearTimeout(timer);
                renderCommunityBooks();
            }
        }

        document.getElementById('searchInput').addEventListener('input', e => {
            currentKeyword = e.target.value.trim().toLowerCase();
            renderCommunityBooks();
        });
        window.addEventListener('langChanged', () => {
            renderCommunityBooks();
            document.getElementById('searchInput').placeholder = window.getLang() === 'en' ? 'Search books...' : '搜索书名或作者...';
        });
        window.addEventListener('authorsLoaded', () => { if (COMMUNITY_BOOKS.length) renderCommunityBooks(); });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').placeholder = window.getLang() === 'en' ? 'Search books...' : '搜索书名或作者...';
            renderCommunityBooks();
            loadCommunityBooks();
        });
    </script>
</body>
</html>
