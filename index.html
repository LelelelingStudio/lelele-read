<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>了了了读 - 纯净在线电子书阅读器</title>
    
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="common-ui.css">
    <link rel="stylesheet" href="rank-plus.css">
    <link rel="stylesheet" href="home-nav.css">
    <script src="common.js"></script>
    <script src="common-ui.js"></script>
    <script src="shelf-plus.js"></script>
    <script src="rank-plus.js"></script>
    <script src="home-nav.js"></script>
    <script src="supabase-js.min.js"></script>
    <script defer src="user-api.js"></script>
    <script defer src="user-auth.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(145deg, #f0f4f9 0%, #e8ecf5 100%);
        }
        html.dark-mode {
            --bg-gradient: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        }
        body {
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部导航栏 (类似游站) */
        .top-bar {
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 28px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .site-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-main);
            text-decoration: none;
            white-space: nowrap;
        }
        .site-title img { height: 32px; width: 32px; border-radius: 50%; }

        /* 搜索框居中 */
        .search-wrapper {
            flex: 1;
            max-width: 500px;
            position: relative;
        }
        .search-wrapper input {
            width: 100%;
            padding: 10px 20px 10px 40px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-wrapper input:focus {
            background: var(--bg-page);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .search-wrapper::before {
            content: '🔍';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.5;
        }

        .right-actions { display: flex; gap: 8px; align-items: center; }
        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .action-btn:hover { color: var(--primary); border-color: var(--primary); }

        /* 分类导航 */
        .categories-container {
            max-width: 1200px;
            margin: 24px auto 0;
            padding: 0 20px;
            width: 100%;
        }
        .categories {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 8px 20px;
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn:hover { color: var(--primary); }
        .cat-btn.active {
            background: var(--bg-card);
            border-color: var(--border-color);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* 书籍网格区 */
        .main-content {
            max-width: 1200px;
            margin: 20px auto 60px;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
            border-color: var(--primary);
        }
        .book-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .book-icon {
            font-size: 2.5rem;
            background: rgba(148, 163, 184, 0.1);
            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
        }
        .book-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .book-author {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .book-btn {
            margin-top: auto;
            align-self: flex-start;
            padding: 6px 16px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .book-card:hover .book-btn {
            background: var(--primary);
            color: #fff;
        }

        .book-desc {
            font-size: .86rem; color: var(--text-muted); line-height: 1.7;
            margin: 0 0 18px; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .status-msg { text-align: center; color: var(--text-muted); padding: 40px 0; grid-column: 1 / -1; }

        /* 读者中心：继续阅读 / 收藏 / 阅读统计 */
        .shelf-section { display: none; margin-bottom: 26px; }
        .shelf-section.show { display: block; }
        .shelf-title { font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin: 0 0 12px; }
        .shelf-row { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
        .shelf-card { flex: 0 0 180px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; cursor: pointer; transition: all .2s; }
        .shelf-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .shelf-card .sc-title { font-weight: 700; color: var(--text-main); font-size: .92rem; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .shelf-card .sc-meta { font-size: .78rem; color: var(--text-muted); }
        .shelf-stats { display: flex; gap: 18px; flex-wrap: wrap; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 18px; }
        .shelf-stats .stat { font-size: .82rem; color: var(--text-muted); }
        .shelf-stats .stat b { color: var(--text-main); font-size: 1.05rem; margin-right: 4px; }

        @media (max-width: 768px) {
            .top-bar { padding: 10px 12px; flex-wrap: wrap; gap: 8px; }
            .search-wrapper { order: 3; flex: 0 0 100%; max-width: 100%; width: 100%; margin-top: 0; }
            .site-title span { display: none; }
            .right-actions { flex-wrap: wrap; gap: 5px; min-width: 0; max-width: 100%; justify-content: flex-end; }
            .right-actions .action-btn { padding: 6px 8px; font-size: .74rem; white-space: nowrap; }
            .nt-btn, .hn-btn { padding: 5px 9px; font-size: .72rem; }
            .nt-btn .zh-inline, .nt-btn .en-inline, .hn-btn .zh-inline, .hn-btn .en-inline { display: none !important; }
            .right-actions a[href="data/community/index.html"],
            .right-actions a[href="about.html"] { display: none; }
            .categories { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
            .cat-btn { flex-shrink: 0; white-space: nowrap; padding: 8px 16px; }
            .book-grid { grid-template-columns: 1fr; }
            .main-content { margin-top: 14px; }
        }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <nav class="top-bar">
        <a href="/" class="site-title">
            <img src="leleleread.svg" alt="Logo" onerror="this.style.display='none'">
            <span><span class="zh-inline">了了了读</span><span class="en-inline">lelele Read</span></span>
        </a>
        
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="搜索书名或作者..." autocomplete="off">
        </div>

        <div class="right-actions">
            <a href="reader.html" class="action-btn">📥 <span class="zh-inline">读书器</span><span class="en-inline">Reader</span></a>
            <a href="data/community/index.html" class="action-btn"><span class="zh-inline">共创</span><span class="en-inline">Community</span></a>
            <button class="action-btn" onclick="toggleTheme()">🌙 <span class="zh-inline">主题</span><span class="en-inline">Theme</span></button>
            <button class="action-btn" onclick="toggleLang()">🌐 <span class="zh-inline">EN</span><span class="en-inline">中文</span></button>
            <a href="about.html" class="action-btn"><span class="zh-inline">关于</span><span class="en-inline">About</span></a>
            <span id="authSlot" class="auth-slot"></span>
        </div>
    </nav>

    <!-- 分类 -->
    <div class="categories-container">
        <div class="categories">
            <button class="cat-btn active" data-cat="all"><span class="zh-inline">全部</span><span class="en-inline">All</span></button>
            <button class="cat-btn" data-cat="classic"><span class="zh-inline">古典</span><span class="en-inline">Classics</span></button>
            <button class="cat-btn" data-cat="religion"><span class="zh-inline">宗教</span><span class="en-inline">Religion</span></button>
            <button class="cat-btn" data-cat="community"><span class="zh-inline">共创书库</span><span class="en-inline">Community</span></button>
        </div>
    </div>

    <!-- 网格 -->
    <main class="main-content">
        <section class="shelf-section" id="readerHub"></section>
        <div class="book-grid" id="bookGrid">
            <div class="status-msg">正在加载书目...</div>
        </div>
    </main>

    <div id="footerPlaceholder"></div>

    <script>
        let BOOKS = [];
        let currentCategory = 'all';
        let currentKeyword = '';
        const gridEl = document.getElementById('bookGrid');

        function authorName(book, lang) {
            const a = book.author;
            if (a === 'luxun') return lang === 'en' ? 'Lu Xun' : '鲁迅';
            if (typeof a === 'number' || /^\d+$/.test(String(a))) {
                const found = (window.AUTHORS_DATA || []).find(x => String(x.id) === String(a));
                if (found) return lang === 'en' ? (found.name_en || found.name_zh) : (found.name_zh || found.name_en);
                if (book.author_label_zh || book.author_label_en) {
                    return lang === 'en' ? (book.author_label_en || book.author_label_zh) : (book.author_label_zh || book.author_label_en);
                }
                const list = window.AUTHORS_DATA || [];
                return list.length ? (lang === 'en' ? 'Unknown' : '未知作者') : '…';
            }
            return String(a || '');
        }

        function bookLink(book, lang) {
            const suffix = lang === 'en' ? (book.url && book.url.indexOf('?') !== -1 ? '&lang=en' : '?lang=en') : '';
            if (book.url) return book.url + suffix;
            return 'reader.html?book=' + encodeURIComponent(book.id) + suffix;
        }

        function renderBooks() {
            const lang = window.getLang();
            const filtered = BOOKS.filter(book => {
                if (currentCategory !== 'all' && book.cat !== currentCategory) return false;
                if (!currentKeyword) return true;
                const hay = [
                    book.title_zh, book.title_en, book.desc_zh, book.desc_en,
                    authorName(book, 'zh'), authorName(book, 'en')
                ].join(' ').toLowerCase();
                return hay.indexOf(currentKeyword) !== -1;
            });

            gridEl.innerHTML = '';
            if (!BOOKS.length) {
                gridEl.innerHTML = '<div class="status-msg">' + (lang === 'en' ? 'Loading books…' : '正在加载书目…') + '</div>';
                return;
            }
            if (!filtered.length) {
                gridEl.innerHTML = '<div class="status-msg">' + (lang === 'en' ? 'No matching books' : '没有找到匹配的书籍') + '</div>';
                return;
            }

            filtered.sort((a, b) => (a.sort || 99) - (b.sort || 99)).forEach(book => {
                const title = lang === 'en' ? (book.title_en || book.title_zh) : (book.title_zh || book.title_en);
                const desc = lang === 'en' ? (book.desc_en || '') : (book.desc_zh || '');
                const card = document.createElement('div');
                card.className = 'book-card';
                card.dataset.bookId = book.id;
                card.dataset.cat = book.cat || '';
                card.dataset.author = authorName(book, lang) || '';
                card.innerHTML = `
                    <div class="book-card-header">
                        <div class="book-icon">${window.escapeHtml(book.icon || '📖')}</div>
                        <div>
                            <div class="book-title">${window.escapeHtml(title)}</div>
                            <div class="book-author">${window.escapeHtml(authorName(book, lang))}</div>
                        </div>
                    </div>
                    ${desc ? `<div class="book-desc">${window.escapeHtml(desc)}</div>` : ''}
                    <div class="book-btn">
                        <span class="zh-inline">${book.id === 'community' ? '进入书库' : '开始阅读'}</span>
                        <span class="en-inline">${book.id === 'community' ? 'Browse' : 'Read Now'}</span>
                    </div>
                `;
                card.onclick = () => {
                    if (window.leleleTrack) window.leleleTrack('read_open-book_' + book.title_zh);
                    window.location.href = bookLink(book, lang);
                };
                gridEl.appendChild(card);
            });
        }

        async function loadBooks() {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 8000);
            try {
                const res = await fetch('data/books.json', { signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                BOOKS = await res.json();
                renderBooks();
            } catch (e) {
                console.warn('[index] 书目加载失败', e.message);
                gridEl.innerHTML = '<div class="status-msg">' + (window.getLang() === 'en' ? 'Failed to load books. Please refresh.' : '书目加载失败，请刷新重试') + '</div>';
            } finally { clearTimeout(timer); }
        }

        document.getElementById('searchInput').addEventListener('input', e => {
            currentKeyword = e.target.value.trim().toLowerCase();
            renderBooks();
        });
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                currentCategory = e.currentTarget.dataset.cat;
                renderBooks();
            });
        });

        function getLS(key, fallback) {
            try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
        }
        function fmtReading(sec) {
            if (!sec) return '0';
            if (sec >= 3600) return (sec / 3600).toFixed(1) + 'h';
            return Math.max(1, Math.round(sec / 60)) + 'm';
        }
        function renderReaderHub() {
            const hub = document.getElementById('readerHub');
            if (!hub) return;
            const lang = window.getLang();
            const recent = getLS('lelele_read_recent', []);
            const favs = getLS('lelele_read_favorites', []);
            const stats = getLS('lelele_read_stats', {});
            let hl = 0, bm = 0, an = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.indexOf('lelele_read_notes_') === 0) {
                    const n = getLS(k, {});
                    hl += (n.highlights || []).length;
                    bm += (n.bookmarks || []).length;
                    an += (n.annotations || []).length;
                }
            }
            let html = '';
            if (Array.isArray(recent) && recent.length) {
                html += `<div class="shelf-title">📖 ${lang === 'en' ? 'Continue reading' : '继续阅读'}</div><div class="shelf-row">`;
                recent.slice(0, 10).forEach(r => {
                    const pct = r.total ? Math.round((r.chapter + 1) / r.total * 100) : 0;
                    html += `<div class="shelf-card" data-kind="recent" data-book-id="${encodeURIComponent(r.id)}" onclick="location.href='reader.html?book=${encodeURIComponent(r.id)}'">
                        <div class="sc-title">${window.escapeHtml(r.title || r.id)}</div>
                        <div class="sc-meta">${lang === 'en' ? 'Chapter ' : '第 '}${(r.chapter || 0) + 1}${r.total ? ' / ' + r.total : ''} · ${pct}%</div>
                    </div>`;
                });
                html += '</div>';
            }
            if (Array.isArray(favs) && favs.length) {
                html += `<div class="shelf-title" style="margin-top:18px">★ ${lang === 'en' ? 'Favorites' : '我的收藏'}</div><div class="shelf-row">`;
                favs.forEach(f => {
                    html += `<div class="shelf-card" data-kind="fav" data-book-id="${encodeURIComponent(f.id)}" onclick="location.href='reader.html?book=${encodeURIComponent(f.id)}'">
                        <div class="sc-title">${window.escapeHtml(f.title || f.id)}</div>
                        <div class="sc-meta">${lang === 'en' ? 'Open' : '打开'}</div>
                    </div>`;
                });
                html += '</div>';
            }
            if ((recent && recent.length) || hl || bm || an || (stats.seconds || 0) > 0) {
                html += `<div class="shelf-stats" style="margin-top:20px">
                    <div class="stat"><b>${Array.isArray(recent) ? recent.length : 0}</b>${lang === 'en' ? 'books' : '在读'}</div>
                    <div class="stat"><b>${hl}</b>${lang === 'en' ? 'highlights' : '划线'}</div>
                    <div class="stat"><b>${bm}</b>${lang === 'en' ? 'bookmarks' : '书签'}</div>
                    <div class="stat"><b>${an}</b>${lang === 'en' ? 'notes' : '批注'}</div>
                    <div class="stat"><b>${fmtReading(stats.seconds || 0)}</b>${lang === 'en' ? 'reading' : '阅读时长'}</div>
                </div>`;
            }
            hub.innerHTML = html;
            hub.classList.toggle('show', !!html);
        }

        function toggleLang() { window.setLang(window.getLang() === 'zh' ? 'en' : 'zh'); }

        window.addEventListener('langChanged', () => {
            renderBooks();
            renderReaderHub();
            document.getElementById('searchInput').placeholder = window.getLang() === 'en' ? 'Search books or authors...' : '搜索书名或作者...';
        });
        window.addEventListener('authorsLoaded', () => { if (BOOKS.length) renderBooks(); });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').placeholder = window.getLang() === 'en' ? 'Search books or authors...' : '搜索书名或作者...';
            renderBooks();
            renderReaderHub();
            loadBooks();
            if (window.UserAuth) UserAuth.init();
        });
    </script>
</body>
</html>
