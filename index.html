<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>了了了读 - 纯净在线电子书阅读器</title>
    
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(145deg, #f0f4f9 0%, #e8ecf5 100%);
        }
        html.dark-mode {
            --bg-gradient: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        }
        body {
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部导航栏 (类似游站) */
        .top-bar {
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 28px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .site-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-main);
            text-decoration: none;
            white-space: nowrap;
        }
        .site-title img { height: 32px; width: 32px; border-radius: 50%; }

        /* 搜索框居中 */
        .search-wrapper {
            flex: 1;
            max-width: 500px;
            position: relative;
        }
        .search-wrapper input {
            width: 100%;
            padding: 10px 20px 10px 40px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-wrapper input:focus {
            background: var(--bg-page);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .search-wrapper::before {
            content: '🔍';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.5;
        }

        .right-actions { display: flex; gap: 8px; align-items: center; }
        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .action-btn:hover { color: var(--primary); border-color: var(--primary); }

        /* 分类导航 */
        .categories-container {
            max-width: 1200px;
            margin: 24px auto 0;
            padding: 0 20px;
            width: 100%;
        }
        .categories {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 8px 20px;
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn:hover { color: var(--primary); }
        .cat-btn.active {
            background: var(--bg-card);
            border-color: var(--border-color);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* 书籍网格区 */
        .main-content {
            max-width: 1200px;
            margin: 20px auto 60px;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
            border-color: var(--primary);
        }
        .book-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .book-icon {
            font-size: 2.5rem;
            background: rgba(148, 163, 184, 0.1);
            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
        }
        .book-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .book-author {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .book-btn {
            margin-top: auto;
            align-self: flex-start;
            padding: 6px 16px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .book-card:hover .book-btn {
            background: var(--primary);
            color: #fff;
        }

        .status-msg { text-align: center; color: var(--text-muted); padding: 40px 0; grid-column: 1 / -1; }

        @media (max-width: 768px) {
            .top-bar { padding: 12px 16px; flex-wrap: wrap; }
            .search-wrapper { order: 3; max-width: 100%; width: 100%; margin-top: 8px; }
            .site-title span { display: none; }
        }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <nav class="top-bar">
        <a href="/" class="site-title">
            <img src="leleleread.svg" alt="Logo" onerror="this.style.display='none'">
            <span><span class="zh-inline">了了了读</span><span class="en-inline">lelele Read</span></span>
        </a>
        
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="搜索书名或作者..." autocomplete="off">
        </div>

        <div class="right-actions">
            <button class="action-btn" onclick="toggleTheme()">🌙 <span class="zh-inline">主题</span><span class="en-inline">Theme</span></button>
            <button class="action-btn" onclick="toggleLang()">🌐 <span class="zh-inline">EN</span><span class="en-inline">中文</span></button>
            <a href="about.html" class="action-btn"><span class="zh-inline">关于</span><span class="en-inline">About</span></a>
        </div>
    </nav>

    <!-- 分类 -->
    <div class="categories-container">
        <div class="categories">
            <button class="cat-btn active" data-cat="all"><span class="zh-inline">全部</span><span class="en-inline">All</span></button>
            <button class="cat-btn" data-cat="classic"><span class="zh-inline">古典</span><span class="en-inline">Classics</span></button>
            <button class="cat-btn" data-cat="religion"><span class="zh-inline">宗教</span><span class="en-inline">Religion</span></button>
            <button class="cat-btn" data-cat="community"><span class="zh-inline">共创书库</span><span class="en-inline">Community</span></button>
        </div>
    </div>

    <!-- 网格 -->
    <main class="main-content">
        <div class="book-grid" id="bookGrid">
            <div class="status-msg">正在加载书目...</div>
        </div>
    </main>

    <div id="footerPlaceholder"></div>

    <script>
        const MOCK_BOOKS = [
            { id: 'bible', title_zh: '圣经', title_en: 'Holy Bible', author: '了了了岭工作室', cat: 'religion', icon: '📖', url: 'data/bible/bible_a.html' },
            { id: 'luxun', title_zh: '鲁迅全集', title_en: 'Lu Xun Works', author: 'luxun', cat: 'classic', icon: '🖋️', url: 'data/tree_zhou/tree_zhou.html' },
            { id: 'shijing', title_zh: '诗经', title_en: 'Book of Songs', author: '佚名', cat: 'classic', icon: '🌿', url: 'data/shijing/shijing.html' },
            { id: 'community', title_zh: '共创书库', title_en: 'Community Library', author: '书友们', cat: 'community', icon: '👥', url: 'data/community/index.html' }
        ];

        let currentCategory = 'all';
        let currentKeyword = '';
        const gridEl = document.getElementById('bookGrid');

        function renderBooks() {
            gridEl.innerHTML = '';
            
            const filtered = MOCK_BOOKS.filter(book => {
                const matchCat = currentCategory === 'all' || book.cat === currentCategory;
                
                const titleZh = (book.title_zh || '').toLowerCase();
                const titleEn = (book.title_en || '').toLowerCase();
                let authorName = '';
                
                if (typeof book.author === 'number' || /^\d+$/.test(book.author)) {
                    const apiAuthor = window.AUTHORS_DATA?.find(a => a.id === book.author);
                    authorName = apiAuthor ? apiAuthor.name_zh : '';
                } else if (window.AUTHORS_DATA) {
                    const apiAuthor = window.AUTHORS_DATA.find(a => a.name_zh === book.author || a.name_en === book.author || a.id === book.author);
                    authorName = apiAuthor ? apiAuthor.name_zh : book.author;
                } else {
                    authorName = book.author;
                }
                
                const matchKeyword = titleZh.includes(currentKeyword) || titleEn.includes(currentKeyword) || (authorName || '').toLowerCase().includes(currentKeyword);
                return matchCat && matchKeyword;
            });

            if (filtered.length === 0) {
                gridEl.innerHTML = '<div class="status-msg">没有找到匹配的书籍</div>';
                return;
            }

            const lang = window.getLang();

            filtered.forEach(book => {
                const title = lang === 'en' ? (book.title_en || book.title_zh) : (book.title_zh || book.title_en);
                
                let displayAuthor = book.author;
                if (book.author === 'luxun') {
                    displayAuthor = lang === 'en' ? 'Lu Xun' : '鲁迅';
                } else if (typeof book.author === 'number' || /^\d+$/.test(book.author)) {
                    if (window.AUTHORS_DATA) {
                        const a = window.AUTHORS_DATA.find(x => x.id === parseInt(book.author));
                        displayAuthor = a ? (lang === 'en' ? a.name_en : a.name_zh) : '未知作者';
                    } else {
                        displayAuthor = '...';
                    }
                }

                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-card-header">
                        <div class="book-icon">${book.icon}</div>
                        <div>
                            <div class="book-title">${window.escapeHtml(title)}</div>
                            <div class="book-author">${window.escapeHtml(displayAuthor)}</div>
                        </div>
                    </div>
                    <div class="book-btn">
                        <span class="zh-inline">开始阅读</span>
                        <span class="en-inline">Read Now</span>
                    </div>
                `;
                card.onclick = () => {
                    if (window.leleleTrack) window.leleleTrack('open-book_' + book.title_zh);
                    window.location.href = book.url + (lang === 'en' ? '?lang=en' : '');
                };
                gridEl.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentKeyword = e.target.value.trim().toLowerCase();
            renderBooks();
        });

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                currentCategory = e.currentTarget.dataset.cat;
                renderBooks();
            });
        });

        function toggleLang() {
            const current = window.getLang();
            window.setLang(current === 'zh' ? 'en' : 'zh');
        }

        window.addEventListener('langChanged', () => {
            renderBooks();
            const lang = window.getLang();
            document.getElementById('searchInput').placeholder = lang === 'en' ? 'Search books or authors...' : '搜索书名或作者...';
        });
        window.addEventListener('authorsLoaded', renderBooks);

        document.addEventListener('DOMContentLoaded', () => {
            const lang = window.getLang();
            document.getElementById('searchInput').placeholder = lang === 'en' ? 'Search books or authors...' : '搜索书名或作者...';
            renderBooks();
        });
    </script>
</body>
</html>
