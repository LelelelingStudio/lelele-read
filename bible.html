<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>圣经 · 了了了读</title>
    <meta name="theme-color" content="#2F5D50">
    <link rel="icon" href="favicon.ico" type="image/x-icon" onerror="this.style.display='none'">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="common-ui.css">
    <link rel="stylesheet" href="bible.css?v=11">
    <script src="common.js"></script>
    <script src="common-ui.js"></script>
    <script src="epub-bridge.js"></script>
    <script src="bible.js?v=11"></script>
    <script src="bible-tools.js?v=11"></script>
</head>
<body class="bb-body bb-view-books">

    <header class="bb-top">
        <div class="bb-top-left">
            <a class="bb-back" href="index.html" data-t-zh="返回书库" data-t-en="Back to library" aria-label="返回书库">← <span data-zh="书库" data-en="Library">书库</span></a>
            <span class="bb-brand"><span data-zh="圣经" data-en="Holy Bible">圣经</span> <i>·</i> <span data-zh="了了了读" data-en="lelele Read">了了了读</span></span>
        </div>
        <div class="bb-version" id="bbVersion" role="tablist" data-t-zh="译本" data-t-en="Translation" aria-label="译本">
            <button type="button" class="bb-vbtn active" data-v="cn">中文</button>
            <button type="button" class="bb-vbtn" data-v="web">English</button>
        </div>
        <div class="bb-crumb" id="bbCrumb"></div>
        <div class="bb-tools" id="bbTools">
            <button type="button" class="bb-btn" data-act="search" data-t-zh="搜索经文" data-t-en="Search verses" title="搜索经文"><span class="bb-ico">⌕</span><span data-zh="搜索" data-en="Search">搜索</span></button>
            <button type="button" class="bb-btn" data-act="copy" data-t-zh="复制经文范围" data-t-en="Copy a range" title="复制经文范围"><span class="bb-ico">⧉</span><span data-zh="复制" data-en="Copy">复制</span></button>
            <button type="button" class="bb-btn" data-act="export" data-t-zh="导出" data-t-en="Export" title="导出"><span class="bb-ico">⇩</span><span data-zh="导出" data-en="Export">导出</span></button>
            <button type="button" class="bb-btn" data-act="notes" data-t-zh="我的笔记" data-t-en="My notes" title="我的笔记"><span class="bb-ico">✎</span><span data-zh="笔记" data-en="Notes">笔记</span></button>
            <button type="button" class="bb-btn" data-act="skin" data-t-zh="阅读背景" data-t-en="Reading background" title="阅读背景"><span class="bb-ico">◐</span><span data-zh="背景" data-en="Background">背景</span></button>
            <button type="button" class="bb-btn" data-act="changelog" data-t-zh="更新日志" data-t-en="Changelog" title="更新日志"><span class="bb-ico">⟳</span><span data-zh="日志" data-en="Changelog">日志</span></button>
            <button type="button" class="bb-btn bb-btn-icon" data-act="about" data-t-zh="译本与版权" data-t-en="Translations &amp; Copyright" title="译本与版权">ℹ</button>
            <button type="button" class="bb-btn bb-btn-icon" id="bbLangBtn" title="切换 English">EN</button>
            <button type="button" class="bb-btn bb-btn-icon" data-act="theme" data-t-zh="深色 / 浅色" data-t-en="Dark / Light mode" title="深色 / 浅色">☾</button>
        </div>
    </header>

    <div class="bb-app">
        <aside class="bb-panel bb-books" id="bbBooks">
            <div class="bb-panel-head">
                <span data-zh="书卷目录" data-en="Books">书卷目录</span>
                <span class="bb-count" id="bbBookCount">66</span>
            </div>
            <div class="bb-search">
                <input type="text" id="bbBookSearch" autocomplete="off" data-ph-zh="搜索书卷或序号..." data-ph-en="Search books or number..." placeholder="搜索书卷或序号...">
            </div>
            <div class="bb-book-list" id="bbBookList"><div class="bb-loading" data-zh="正在加载目录…" data-en="Loading books…">正在加载目录…</div></div>
        </aside>

        <nav class="bb-panel bb-nav" id="bbNav">
            <div class="bb-panel-head"><span data-zh="章节" data-en="Chapters">章节</span><span class="bb-count" id="bbChapCount"></span></div>
            <div class="bb-chap-grid" id="bbChapGrid"></div>
            <div class="bb-panel-sub"><span data-zh="节" data-en="Verses">节</span><span class="bb-count" id="bbVerseCount"></span></div>
            <div class="bb-verse-grid" id="bbVerseGrid"></div>
        </nav>

        <main class="bb-read" id="bbRead">
            <div class="bb-read-head" id="bbReadHead"></div>
            <div class="bb-verses" id="bbVerses"></div>
            <div class="bb-chapter-foot" id="bbChapFoot"></div>
        </main>
    </div>

    <div class="bb-audio" id="bbAudio" hidden>
        <button type="button" class="bb-audio-btn" id="bbAudioPlay" data-act="audio-toggle" data-t-zh="播放 / 暂停" data-t-en="Play / Pause" aria-label="播放 / 暂停">▶</button>
        <div class="bb-audio-info"><span class="bb-audio-title" id="bbAudioTitle"></span></div>
        <div class="bb-audio-track" id="bbAudioTrack"><div class="bb-audio-bar" id="bbAudioBar"></div></div>
        <span class="bb-audio-time" id="bbAudioTime">0:00</span>
    </div>

    <footer class="bb-foot" id="bbFoot">
        <div class="bb-foot-pos" id="bbFootPos"></div>
        <div class="bb-foot-tools">
            <button type="button" class="bb-mini" data-act="font-minus" data-t-zh="缩小字号" data-t-en="Smaller text" aria-label="缩小字号">A−</button>
            <span class="bb-font-val" id="bbFontVal">17</span>
            <button type="button" class="bb-mini" data-act="font-plus" data-t-zh="放大字号" data-t-en="Larger text" aria-label="放大字号">A+</button>
            <span class="bb-sep"></span>
            <button type="button" class="bb-mini bb-swatch" data-palette="paper" data-t-zh="纸白" data-t-en="Paper" title="纸白" aria-label="纸白"></button>
            <button type="button" class="bb-mini bb-swatch" data-palette="sepia" data-t-zh="旧纸" data-t-en="Sepia" title="旧纸" aria-label="旧纸"></button>
            <button type="button" class="bb-mini bb-swatch" data-palette="mint" data-t-zh="青苔" data-t-en="Mint" title="青苔" aria-label="青苔"></button>
            <span class="bb-sep"></span>
            <button type="button" class="bb-mini" data-act="go-top" data-zh="回到顶部" data-en="Top">回到顶部</button>
        </div>
        <div class="bb-foot-progress"><i id="bbProgress"></i></div>
    </footer>

    <nav class="bb-mobile-nav" id="bbMobileNav">
        <button type="button" data-view="books"><span>▤</span><span data-zh="书库" data-en="Books">书库</span></button>
        <button type="button" data-view="chapters"><span>☷</span><span data-zh="章节" data-en="Chapters">章节</span></button>
        <button type="button" data-view="read"><span>▧</span><span data-zh="阅读" data-en="Read">阅读</span></button>
        <button type="button" data-act="notes"><span>✎</span><span data-zh="笔记" data-en="Notes">笔记</span></button>
    </nav>

    <div class="bb-overlay" id="bbOverlay" hidden><div class="bb-modal" id="bbModal" role="dialog" aria-modal="true"></div></div>
    <div class="bb-sheet-mask" id="bbSheetMask" hidden></div>
    <div class="bb-sheet" id="bbSheet" hidden role="dialog" aria-modal="true"></div>

</body>
</html>
