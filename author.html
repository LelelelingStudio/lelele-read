<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作者主页 - 了了了读</title>
    
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
    <script src="supabase-js.min.js"></script>
    <script defer src="user-api.js"></script>
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-page);
        }

        /* 顶部导航 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.2rem;
        }
        .brand img { width: 32px; height: 32px; border-radius: 50%; }
        .btn-back {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(148, 163, 184, 0.1);
            transition: all 0.2s;
        }
        .btn-back:hover { color: var(--primary); background: rgba(148, 163, 184, 0.2); }

        /* 作者信息卡片 */
        .author-hero {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 30px;
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 40px;
            box-shadow: var(--shadow-sm);
        }
        .author-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
            overflow: hidden;
        }
        .author-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .author-info { flex: 1; }
        .author-name {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }
        .author-bio {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* 作品列表 */
        .works-section {
            max-width: 1000px;
            margin: 0 auto 60px;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }
        .works-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 4px solid var(--primary);
            color: var(--text-main);
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .book-icon { font-size: 2.5rem; }
        .book-info h3 { font-size: 1.1rem; color: var(--text-main); margin-bottom: 4px; }
        .book-info p { font-size: 0.85rem; color: var(--text-muted); }

        @media (max-width: 768px) {
            .author-hero { flex-direction: column; text-align: center; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="/index.html" class="brand">
            <img src="leleleread.svg" alt="Logo" onerror="this.style.display='none'">
            <span class="zh-inline">了了了读</span><span class="en-inline">lelele Read</span>
        </a>
        <a href="/index.html" class="btn-back">← <span class="zh-inline">返回首页</span><span class="en-inline">Back to Home</span></a>
    </nav>

    <div class="author-hero" id="authorHero" style="display:none;">
        <div class="author-avatar" id="authorAvatar">👤</div>
        <div class="author-info">
            <div class="author-name" id="authorName">加载中...</div>
            <div class="author-bio" id="authorBio">...</div>
        </div>
    </div>

    <div class="works-section">
        <div class="works-title">
            <span class="zh-inline">📚 作品列表</span>
            <span class="en-inline">📚 Works</span>
        </div>
        <div class="book-grid" id="worksGrid">
            <div style="color:var(--text-muted); grid-column: 1/-1;">正在加载作品...</div>
        </div>
    </div>

    <div id="footerPlaceholder"></div>

    <script>
        let ALL_BOOKS = [];
        let dataReady = false;

        const PINYIN_PROFILES = {
            luxun: {
                name_zh: '鲁迅', name_en: 'Lu Xun', avatar: '🖋️',
                bio_zh: '中国现代文学的奠基人。原名周树人，字豫才。本站收录其小说、散文、杂文与散文诗共八个分卷。',
                bio_en: 'Founder of modern Chinese literature. This library includes eight collections of his fiction, essays and prose poems.'
            }
        };

        async function fetchJson(url) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 8000);
            try {
                const res = await fetch(url, { signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } catch (e) {
                console.warn('[author] 读取失败 ' + url, e.message);
                return [];
            } finally { clearTimeout(timer); }
        }

        async function loadData() {
            const [books, community] = await Promise.all([
                fetchJson('/data/books.json'),
                fetchJson('/data/community/books.json')
            ]);
            ALL_BOOKS = books.concat(community.map(b => Object.assign({ isCommunity: true }, b)));
            dataReady = true;
            renderAuthorPage();
        }

        function resolveProfile(authorId, lang) {
            const list = window.AUTHORS_DATA || [];
            const found = list.find(a => String(a.id) === String(authorId) || a.name_zh === authorId || a.name_en === authorId || a.slug === authorId);
            if (found) {
                return {
                    name: lang === 'en' ? (found.name_en || found.name_zh) : (found.name_zh || found.name_en),
                    bio: lang === 'en' ? (found.bio_en || '') : (found.bio_zh || ''),
                    avatar: found.avatar_url || '👤',
                    level: found.authorlevel || 1,
                    official: !!found.official
                };
            }
            const local = PINYIN_PROFILES[authorId];
            if (local) return {
                name: lang === 'en' ? local.name_en : local.name_zh,
                bio: lang === 'en' ? local.bio_en : local.bio_zh,
                avatar: local.avatar, level: 1, official: false
            };
            return { name: authorId, bio: lang === 'en' ? 'No bio yet.' : '暂无简介', avatar: '👤', level: 1, official: false };
        }

        function bookHref(book, lang) {
            const suffix = lang === 'en' ? '?lang=en' : '';
            if (book.isCommunity) return '/data/community/reader.html?id=' + encodeURIComponent(book.id) + (lang === 'en' ? '&lang=en' : '');
            if (book.url) return book.url + suffix;
            return '/reader.html?book=' + encodeURIComponent(book.id) + suffix;
        }

        function renderAuthorPage() {
            const lang = window.getLang();
            const authorId = new URLSearchParams(window.location.search).get('id');
            const hero = document.getElementById('authorHero');
            const grid = document.getElementById('worksGrid');
            hero.style.display = 'flex';

            if (!authorId) {
                document.getElementById('authorName').textContent = lang === 'en' ? 'Unknown author' : '未知作者';
                document.getElementById('authorBio').textContent = lang === 'en' ? 'Missing ?id= parameter' : '缺少 ?id= 参数';
                grid.innerHTML = '<div style="color:var(--text-muted);grid-column:1/-1;">' + (lang === 'en' ? 'No works' : '暂无作品') + '</div>';
                return;
            }

            const profile = resolveProfile(authorId, lang);
            document.getElementById('authorName').textContent = profile.name + (profile.official ? ' ✔' : '');
            const avatar = document.getElementById('authorAvatar');
            if (/^https?:/.test(profile.avatar)) {
                avatar.innerHTML = '<img src="' + window.escapeHtml(profile.avatar) + '" alt="' + window.escapeHtml(profile.name) + '" onerror="this.parentNode.textContent=\'👤\'">';
            } else {
                avatar.textContent = profile.avatar;
            }
            document.getElementById('authorBio').textContent = profile.bio || (lang === 'en' ? 'No bio yet.' : '暂无简介');
            document.title = profile.name + ' · 了了了读';

            if (!dataReady) {
                grid.innerHTML = '<div style="color:var(--text-muted);grid-column:1/-1;">' + (lang === 'en' ? 'Loading works…' : '正在加载作品…') + '</div>';
                return;
            }

            const works = ALL_BOOKS.filter(b => String(b.author) === String(authorId));
            grid.innerHTML = '';
            if (!works.length) {
                grid.innerHTML = '<div style="color:var(--text-muted);grid-column:1/-1;">' + (lang === 'en' ? 'No published works yet' : '该作者暂未发布任何作品') + '</div>';
                return;
            }
            works.forEach(book => {
                const title = lang === 'en' ? (book.title_en || book.title_zh) : (book.title_zh || book.title_en);
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-icon">${window.escapeHtml(book.icon || '📖')}</div>
                    <div class="book-info">
                        <h3>${window.escapeHtml(title)}</h3>
                        <p>${window.escapeHtml(lang === 'en' ? (book.desc_en || 'Read Now') : (book.desc_zh || '点击阅读'))}</p>
                    </div>`;
                card.onclick = () => window.location.href = bookHref(book, lang);
                grid.appendChild(card);
            });
        }

        async function refreshBackendProfile() {
            const authorId = new URLSearchParams(window.location.search).get('id');
            if (!authorId) return;
            try {
                const res = await window.UserAPI.getAuthorProfile(authorId);
                if (res && res.data) {
                    const p = res.data;
                    const lang = window.getLang();
                    const name = p.display_name || authorId;
                    document.getElementById('authorName').textContent = name + (p.is_official ? ' ✔' : '');
                    document.getElementById('authorBio').textContent = lang === 'en' ? (p.bio_en || p.bio_zh || 'No bio yet.') : (p.bio_zh || p.bio_en || '暂无简介');
                    document.title = name + ' · 了了了读';
                    const avatar = document.getElementById('authorAvatar');
                    if (p.avatar_url && /^https?:/.test(p.avatar_url)) {
                        avatar.innerHTML = '<img src="' + window.escapeHtml(p.avatar_url) + '" alt="' + window.escapeHtml(name) + '" onerror="this.parentNode.textContent=\'👤\'">';
                    }
                }
            } catch (e) { /* 后端无该作者资料时忽略，保留静态解析 */ }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderAuthorPage();
            loadData();
            refreshBackendProfile();
        });
        window.addEventListener('authorsLoaded', () => { if (dataReady) renderAuthorPage(); });
        window.addEventListener('langChanged', renderAuthorPage);
    </script>
</body>
</html>
